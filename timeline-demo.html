<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Red Neon Timeline Component - Showcase & Code</title>
    <!-- Google Fonts: Inter and Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        /* ============================================================
       SHOWCASE PAGE GLOBAL STYLES (Pure dark premium layout)
       ============================================================ */
        :root {
            --clr-red: #e5342a;
            --clr-red-glow: rgba(229, 52, 42, 0.4);
            --clr-red-glow-strong: rgba(229, 52, 42, 0.7);
            --clr-bg-black: #000000;
            --clr-card-black: #0a0a0a;
            --clr-text-white: #ffffff;
            --clr-text-gray: #b0b0b0;

            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: var(--clr-text-white);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.6;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(180deg, #111 0%, #050505 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 2px;
            background: var(--clr-red);
            box-shadow: 0 0 10px var(--clr-red);
        }

        header h1 {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, #e5342a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--clr-text-gray);
            font-size: 0.95rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .main-layout {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px 20px;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Column titles */
        .column-title {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-title::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background: var(--clr-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--clr-red);
        }

        /* ============================================================
       PREVIEW CONTAINER WITH RADIAL GLOW
       ============================================================ */
        .preview-column {
            background: var(--clr-bg-black);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.03);
            overflow: hidden;

            /* Subtle red radial glow in the corners & center */
            background-image:
                radial-gradient(circle at 10% 10%, rgba(229, 52, 42, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(229, 52, 42, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(229, 52, 42, 0.03) 0%, transparent 60%);
        }

        /* ============================================================
       REUSABLE GLOWING RED TIMELINE STYLES
       ============================================================ */
        .timeline-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .timeline-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 0;
        }

        /* Vertical connecting line */
        .timeline-line {
            position: absolute;
            left: 18px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom,
                    rgba(229, 52, 42, 0.05) 0%,
                    rgba(229, 52, 42, 0.8) 15%,
                    rgba(229, 52, 42, 0.8) 85%,
                    rgba(229, 52, 42, 0.05) 100%);
            box-shadow: 0 0 10px rgba(229, 52, 42, 0.3);
            border-radius: 4px;
        }

        .timeline-items {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .timeline-item {
            position: relative;
            padding-left: 55px;
            /* Offset to make room for line & dot */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .timeline-item:nth-child(1) {
            animation-delay: 0.1s;
        }

        .timeline-item:nth-child(2) {
            animation-delay: 0.25s;
        }

        .timeline-item:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Timeline dot connecting card to central line */
        .timeline-dot {
            position: absolute;
            left: 10px;
            top: 36px;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            background: var(--clr-bg-black);
            border: 3px solid var(--clr-red);
            box-shadow: 0 0 12px var(--clr-red-glow-strong);
            z-index: 2;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .timeline-item:hover .timeline-dot {
            background: var(--clr-red);
            transform: scale(1.2);
        }

        /* Event Card Component */
        .timeline-card {
            background-color: var(--clr-card-black);
            border: 2px solid var(--clr-red);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 0 20px var(--clr-red-glow);
            position: relative;
            transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1),
                box-shadow 0.3s cubic-bezier(0.165, 0.84, 0.44, 1),
                border-color 0.3s ease;
            cursor: pointer;
        }

        .timeline-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 28px var(--clr-red-glow-strong);
            border-color: #ff554c;
        }

        /* Card Badge (Time) */
        .timeline-badge {
            display: inline-block;
            background-color: var(--clr-red);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            padding: 6px 14px;
            border-radius: 999px;
            text-transform: uppercase;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(229, 52, 42, 0.3);
            font-family: var(--font-heading);
        }

        /* Card Title */
        .timeline-title {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.45rem;
            color: var(--clr-text-white);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        /* Card Subtitle / Description */
        .timeline-desc {
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--clr-text-gray);
            font-weight: 400;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        /* Bottom Divider / Progress bar */
        .timeline-divider {
            height: 5px;
            width: 100%;
            background-color: var(--clr-red);
            border-radius: 99px;
            box-shadow: 0 1px 4px rgba(229, 52, 42, 0.2);
            transition: width 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        /* Interactive progressive highlight effect for bottom bar */
        .timeline-divider::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transition: width 0.4s ease;
        }

        .timeline-card:hover .timeline-divider::after {
            width: 100%;
            animation: shine 1.5s infinite;
        }

        @keyframes shine {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        /* ============================================================
       CODE SHOWCASE CONTROLS & VIEWER
       ============================================================ */
        .code-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tabs-container {
            display: flex;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 6px;
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--clr-text-gray);
            padding: 10px 16px;
            cursor: pointer;
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.88rem;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .tab-btn:hover {
            color: #fff;
        }

        .tab-btn.active {
            background: var(--clr-red);
            color: #fff;
            box-shadow: 0 4px 12px rgba(229, 52, 42, 0.3);
        }

        .code-viewer-container {
            background: #0d0d0e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 500px;
            max-height: 700px;
            overflow: hidden;
            position: relative;
        }

        .code-header {
            background: #141416;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .code-file-name {
            font-family: monospace;
            font-size: 0.88rem;
            color: #b8b8b8;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--clr-text-gray);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .copy-btn:hover {
            background: var(--clr-red);
            border-color: var(--clr-red);
            color: #fff;
        }

        .code-body {
            padding: 20px;
            overflow: auto;
            flex-grow: 1;
            margin: 0;
        }

        pre {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #d4d4d4;
        }

        code {
            display: block;
            white-space: pre;
        }

        /* Syntax Highlighting Colors */
        .keyword {
            color: #f92672;
            font-weight: bold;
        }

        .comment {
            color: #75715e;
            font-style: italic;
        }

        .string {
            color: #e6db74;
        }

        .number {
            color: #ae81ff;
        }

        .tag {
            color: #f92672;
        }

        .attr {
            color: #a6e22e;
        }

        .cls {
            color: #66d9ef;
            font-style: italic;
        }

        .custom {
            color: #fd971f;
        }

        .func {
            color: #66d9ef;
        }

        /* Success toast styling */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #111;
            border-left: 4px solid var(--clr-red);
            padding: 12px 24px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 10px rgba(229, 52, 42, 0.2);
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.9rem;
            transform: translateY(100px);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>

        // Render original template interactive list on the preview column
        function renderPreview() {
            const container = document.getElementById('timeline-interactive-preview');
            container.innerHTML = eventData.map(event => `
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-card">
            <span class="timeline-badge">${event.time}</span>
            <h3 class="timeline-title">${event.title}</h3>
            <p class="timeline-desc">${event.description}</p>
            <div class="timeline-divider"></div>
          </div>
        </div>
      `).join('');
        }

        // Active tab store
        let activeTabId = 'react';

        // Tab switcher handler
        function switchTab(tabId) {
            // Remove class active from tabs
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            // Update visual active state
            event.target.classList.add('active');
            activeTabId = tabId;

            // Show content
            const snippet = codeSnippets[tabId];
            if (snippet) {
                document.getElementById('filename-display').innerText = snippet.filename;

                // Remove highlighting markers inside direct text extraction
                const cleanCodeDiv = document.createElement('div');
                cleanCodeDiv.innerHTML = snippet.code;

                document.getElementById('code-snippet-display').innerHTML = snippet.code;
            }
        }

        // Copy to clipboard helper
        function copyCurrentCode() {
            // Extract code block inner text
            const preElem = document.getElementById('code-snippet-display');

            // We need raw text without html parser coloring tags
            const rawText = preElem.innerText;

            navigator.clipboard.writeText(rawText).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        // Initial setup
        document.addEventListener('DOMContentLoaded', () => {
            renderPreview();
            // Setup initial react tab state representation
            document.getElementById('code-snippet-display').innerHTML = codeSnippets['react'].code;
        });
    </script>
